name: StockVault CI — Database & API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  database-and-api-tests:
    name: PostgreSQL Schema, Business Logic & API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stockvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: stockvault
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stockvault

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Database Setup ───────────────────────────────────────
      - name: Create schema and tables
        run: psql -v ON_ERROR_STOP=1 -f database/schema/final_ddl.sql

      - name: Load seed data
        run: psql -v ON_ERROR_STOP=1 -f database/schema/seed_data.sql

      - name: Create performance indexes
        run: psql -v ON_ERROR_STOP=1 -f database/schema/indexes.sql

      - name: Create views
        run: psql -v ON_ERROR_STOP=1 -f database/schema/views.sql

      - name: Create triggers and functions
        run: psql -v ON_ERROR_STOP=1 -f database/schema/triggers_functions.sql

      - name: Create RLS policies
        run: psql -v ON_ERROR_STOP=1 -f database/schema/rls_policies.sql

      - name: Enable triggers (post-seed verification)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SET search_path TO trading;
          ALTER TABLE order_record ENABLE TRIGGER trg_validate_order;
          ALTER TABLE trade ENABLE TRIGGER trg_trade_update_holdings;
          ALTER TABLE trade ENABLE TRIGGER trg_trade_update_order_status;
          ALTER TABLE trade ENABLE TRIGGER trg_trade_adjust_balance;
          SQL

      # ── Database Tests ───────────────────────────────────────
      - name: "Test: Schema & Structure"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_schema.sql

      - name: "Test: Constraint Enforcement"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_constraints.sql

      - name: "Test: Trigger Logic"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_triggers.sql

      - name: "Test: View Correctness"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_views.sql

      - name: "Test: Index Existence"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_indexes.sql

      - name: "Test: Seed Data Integrity"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_seed_data.sql

      - name: "Test: Row-Level Security (RLS)"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_rls.sql

      - name: "Test: Financial Invariants & Arithmetic"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_financial_invariants.sql

      - name: "Test: Query Execution (All 30 Queries)"
        run: psql -v ON_ERROR_STOP=1 -f tests/test_queries.sql

      # ── Backend Node.js API Tests ────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run Backend API Test Suite
        run: npm test
