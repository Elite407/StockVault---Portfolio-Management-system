<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  INVESTOR |o--|| RETAIL_INVESTOR : "ISA retail"
  INVESTOR |o--|| INSTITUTIONAL_INVESTOR : "ISA institutional"
  INVESTOR ||--o{ KYC_DOCUMENT : submits
  INVESTOR ||--o{ TRADING_ACC : owns
  INVESTOR ||--o{ BANK_ACC : owns
  INVESTOR ||--o{ PORTFOLIO : owns
  INVESTOR ||--o{ ORDER_RECORD : places
  INVESTOR ||--o{ BROKER_CLIENT : links
  BROKER ||--o{ BROKER_CLIENT : links
  BROKER }o--o| ORDER_RECORD : "places optional"
  TRADING_ACC ||--o{ FUND_TRANSACTION : records
  BANK_ACC ||--o{ FUND_TRANSACTION : sources
  TRADING_ACC ||--o{ ORDER_RECORD : uses
  SECURITY |o--|| EQUITY : "ISA equity"
  SECURITY |o--|| MUTUAL_FUND : "ISA mutual fund"
  SECURITY ||--o{ ORDER_RECORD : referenced_in
  PORTFOLIO ||--o{ HOLDING : contains
  SECURITY ||--o{ HOLDING : held_as
  ORDER_RECORD ||--o{ TRADE : generates
  TRADE ||--o{ CAPITAL_GAINS_RECORD : "buy lot"
  TRADE ||--o{ CAPITAL_GAINS_RECORD : "sell lot"

  INVESTOR {
    int INVESTOR_ID PK
    string EMAIL "candidate key"
    string PAN_NO "candidate key"
    string AADHAR_NO "candidate key"
    string INVESTOR_TYPE "ISA discriminator"
  }
  RETAIL_INVESTOR {
    int INVESTOR_ID PK "also FK"
    string RISK_PROFILE
  }
  INSTITUTIONAL_INVESTOR {
    int INVESTOR_ID PK "also FK"
    string CIN_NO "candidate key"
  }
  KYC_DOCUMENT {
    int DOC_ID PK
    string DOC_NO "candidate key"
    int INVESTOR_ID FK
  }
  TRADING_ACC {
    int TA_ID PK
    int INVESTOR_ID FK
  }
  BANK_ACC {
    int BANK_ACC_ID PK
    string ACC_NO "candidate key"
    int INVESTOR_ID FK
  }
  FUND_TRANSACTION {
    int TXN_ID PK
    string REFERENCE_NUMBER "candidate key"
    int TA_ID FK
    int BANK_ACC_ID FK
  }
  BROKER {
    int BROKER_ID PK
    string EMAIL "candidate key"
    string SEBI_LICENSE_NO "candidate key"
  }
  BROKER_CLIENT {
    int BC_ID PK
    int INVESTOR_ID FK
    int BROKER_ID FK
  }
  SECURITY {
    int SECURITY_ID PK
    string TICKER "candidate key"
    string ISIN "candidate key"
    string SECURITY_TYPE "ISA discriminator"
  }
  EQUITY {
    int SECURITY_ID PK "also FK"
  }
  MUTUAL_FUND {
    int SECURITY_ID PK "also FK"
  }
  PORTFOLIO {
    int PORTFOLIO_ID PK
    int INVESTOR_ID FK
  }
  HOLDING {
    int HOLDING_ID PK
    int PORTFOLIO_ID FK
    int SECURITY_ID FK
  }
  ORDER_RECORD {
    int ORDER_ID PK
    int INVESTOR_ID FK
    int SECURITY_ID FK
    int TA_ID FK
    int PLACED_BY_BROKER FK
  }
  TRADE {
    int TRADE_ID PK
    string TRADE_REF "candidate key"
    int ORDER_ID FK
  }
  CAPITAL_GAINS_RECORD {
    int CG_ID PK
    int BUY_TRADE_ID FK
    int SELL_TRADE_ID FK
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
